      objects.forEach(o=>{ if(!selected.has(o.id)) return; const b=bboxOf(o); minX=Math.min(minX,b.minX);minY=Math.min(minY,b.minY);maxX=Math.max(maxX,b.maxX);maxY=Math.max(maxY,b.maxY);});
      return {minX,minY,maxX,maxY,cx:(minX+maxX)/2,cy:(minY+maxY)/2,w:maxX-minX,h:maxY-minY};
    }

    function hitObject(wp){
      for(let i=objects.length-1;i>=0;i--){
        const o=objects[i];
        if(o.type==='stroke'){
          const pts=o.points; const thr=(o.size+6)/cam.zoom;
          for(let j=0;j<pts.length-1;j++){ if(distToSeg(wp.x,wp.y,pts[j].x,pts[j].y,pts[j+1].x,pts[j+1].y)<thr) return o; }
          if(pts.length===1 && Math.hypot(wp.x-pts[0].x,wp.y-pts[0].y)<thr) return o;
        } else if(o.type==='shape'){
          const b=bboxOf(o); if(wp.x>=b.minX-4&&wp.x<=b.maxX+4&&wp.y>=b.minY-4&&wp.y<=b.maxY+4) return o;
        } else {
          const b=bboxOf(o); if(wp.x>=b.minX&&wp.x<=b.maxX&&wp.y>=b.minY&&wp.y<=b.maxY) return o;
        }
      }
      return null;
    }

    function drawObject(o){
      ctx.save();
      if(o.type==='stroke'){
        ctx.globalAlpha = o.opacity!=null?o.opacity:1;
        ctx.strokeStyle=o.color; ctx.lineWidth=o.size; ctx.lineCap='round'; ctx.lineJoin='round';
        if(o.tool==='highlighter'){ ctx.globalAlpha=(o.opacity!=null?o.opacity:1)*0.35; ctx.lineWidth=o.size*2.2; }
        if(o.tool==='pencil'){ ctx.globalAlpha=(o.opacity!=null?o.opacity:1)*0.7; }
        ctx.beginPath();
        const pts=o.points;
        if(pts.length===1){ctx.arc(pts[0].x,pts[0].y,o.size/2,0,7);ctx.fillStyle=o.color;ctx.fill();ctx.restore();return;}
        ctx.moveTo(pts[0].x,pts[0].y);
        for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
        ctx.stroke();
      } else if(o.type==='shape'){
        ctx.globalAlpha=o.opacity!=null?o.opacity:1;
        ctx.strokeStyle=o.color; ctx.lineWidth=o.size||3; ctx.lineCap='round'; ctx.lineJoin='round';
        const p=o.points;
        ctx.beginPath();
        if(o.shape==='line'){ctx.moveTo(p[0].x,p[0].y);ctx.lineTo(p[1].x,p[1].y);}
        else if(o.shape==='arrow'){
          ctx.moveTo(p[0].x,p[0].y);ctx.lineTo(p[1].x,p[1].y);
          const ang=Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x), ah=10+o.size;
          ctx.moveTo(p[1].x,p[1].y);
          ctx.lineTo(p[1].x-ah*Math.cos(ang-0.4), p[1].y-ah*Math.sin(ang-0.4));
          ctx.moveTo(p[1].x,p[1].y);
          ctx.lineTo(p[1].x-ah*Math.cos(ang+0.4), p[1].y-ah*Math.sin(ang+0.4));
        }
        else if(o.shape==='rect'){ctx.rect(p[0].x,p[0].y,p[1].x-p[0].x,p[1].y-p[0].y);}
        else if(o.shape==='ellipse'){const cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2,rx=Math.abs(p[1].x-p[0].x)/2,ry=Math.abs(p[1].y-p[0].y)/2;ctx.ellipse(cx,cy,rx,ry,0,0,7);}
        else if(o.shape==='triangle'){const cx=(p[0].x+p[1].x)/2;ctx.moveTo(cx,p[0].y);ctx.lineTo(p[0].x,p[1].y);ctx.lineTo(p[1].x,p[1].y);ctx.closePath();}
        else if(o.shape==='polygon'){ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();}
        ctx.stroke();
      } else if(o.type==='text'){
        ctx.translate(o.x,o.y); if(o.rot) ctx.rotate(o.rot);
        ctx.globalAlpha=1; ctx.fillStyle=o.color||'#1a1a1a';
        ctx.font = `${o.italic?'italic ':''}${o.bold?'700 ':'400 '}${o.size}px ${o.font||'Arial'}, sans-serif`;
        ctx.textAlign = o.align||'left'; ctx.textBaseline='alphabetic';
        (o.text||'').split('\n').forEach((line,i)=>ctx.fillText(line,0,i*o.size*1.3));
      } else if(o.type==='image'){
        if(o._img){ ctx.translate(o.x+o.w/2,o.y+o.h/2); if(o.rot) ctx.rotate(o.rot); ctx.drawImage(o._img,-o.w/2,-o.h/2,o.w,o.h); }
      }
      ctx.restore();
    }

    // preload images
    objects.forEach(o=>{ if(o.type==='image'&&o.src){const im=new Image();im.src=o.src;o._img=im;} });

    function draw(){
      dirty=false;
      const r=canvas.getBoundingClientRect();
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle=theme().bg; ctx.fillRect(0,0,r.width,r.height);
      // grid dots
      const step=100;
      const wx0=(-cam.x)/cam.zoom, wy0=(-cam.y)/cam.zoom;
      const wx1=(r.width-cam.x)/cam.zoom, wy1=(r.height-cam.y)/cam.zoom;
      if(cam.zoom>0.25){
        ctx.fillStyle=theme().grid;
        const gx=Math.floor(wx0/step)*step, gy=Math.floor(wy0/step)*step;
        for(let x=gx;x<=wx1;x+=step) for(let y=gy;y<=wy1;y+=step){
          const sx=x*cam.zoom+cam.x, sy=y*cam.zoom+cam.y;
          ctx.fillRect(sx-1,sy-1,2,2);
        }
      }
      ctx.save();
      ctx.translate(cam.x,cam.y); ctx.scale(cam.zoom,cam.zoom);
      // cull & draw
      objects.forEach(o=>{
        const b=bboxOf(o);
        if(b.maxX<wx0-50||b.minX>wx1+50||b.maxY<wy0-50||b.minY>wy1+50) return;
        drawObject(o);
      });
      // in-progress
      if(current) drawObject(current);
      if(lassoPts && lassoPts.length>1){
        ctx.strokeStyle=theme().ink==='#1a1a1a'?'#2563eb':'#60a5fa'; ctx.lineWidth=1.5/cam.zoom; ctx.setLineDash([6/cam.zoom,4/cam.zoom]);
        ctx.beginPath(); ctx.moveTo(lassoPts[0].x,lassoPts[0].y);
        lassoPts.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.closePath(); ctx.stroke();
        ctx.setLineDash([]);
      }
      if(rectSel){
        ctx.strokeStyle='#2563eb'; ctx.lineWidth=1.5/cam.zoom; ctx.setLineDash([6/cam.zoom,4/cam.zoom]);
        ctx.strokeRect(rectSel.x,rectSel.y,rectSel.w,rectSel.h); ctx.setLineDash([]);
      }
      if(polyPts && polyPts.length){
        ctx.strokeStyle='#2563eb'; ctx.lineWidth=2/cam.zoom; ctx.beginPath();
        ctx.moveTo(polyPts[0].x,polyPts[0].y); polyPts.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
        polyPts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4/cam.zoom,0,7);ctx.fillStyle='#2563eb';ctx.fill();});
      }
      ctx.restore();
      // selection overlay (screen space)
      const sb=selBbox();
      if(sb){
        const tl=toScreen(sb.minX,sb.minY), br=toScreen(sb.maxX,sb.maxY);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.strokeStyle='#2563eb'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
        ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y); ctx.setLineDash([]);
        // handles
        dragData && dragData.handles && dragData.handles.forEach(h=>{
          ctx.beginPath(); ctx.arc(h.sx,h.sy,6,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#2563eb'; ctx.lineWidth=1.5; ctx.stroke();
        });
        // rotate handle
        const tc=toScreen(sb.cx, sb.minY);
        ctx.beginPath(); ctx.moveTo(tc.x,tl.y); ctx.lineTo(tc.x,tl.y-22); ctx.stroke();
        ctx.beginPath(); ctx.arc(tc.x,tl.y-26,6,0,7); ctx.fillStyle='#2563eb'; ctx.fill();
      }

      document.getElementById('objCount').textContent = objects.length+' objects';
    }
    function redraw(){ if(rafId) return; rafId=requestAnimationFrame(()=>{rafId=null; draw();}); }

    function setStatusText(s){ const el=document.getElementById('statusText'); if(el) el.textContent=s; }
    const saveDebounced = App.debounce(()=>{
      canvasObj.objects = objects.map(o=>{const c={...o}; delete c._img; return c;});

    function markDirtyCanvas(){ if(readonly) return; setStatusText('Đang lưu...'); saveDebounced(); }

    // ---- selection handles ----
    function getHandles(){
      const sb=selBbox(); if(!sb) return [];
      const pts=[['nw',sb.minX,sb.minY],['n',sb.cx,sb.minY],['ne',sb.maxX,sb.minY],['e',sb.maxX,sb.cy],['se',sb.maxX,sb.maxY],['s',sb.cx,sb.maxY],['sw',sb.minX,sb.maxY],['w',sb.minX,sb.cy]];

    }
    function hitHandle(wp){
      const hs=getHandles();
      for(const h of hs){ if(Math.hypot(wp.x-h.wx, wp.y-h.wy) < 10/cam.zoom) return h; }

      const sb=selBbox(); if(sb){ const rw={x:sb.cx,y:sb.minY-(30/cam.zoom)}; if(Math.hypot(wp.x-rw.x,wp.y-rw.y)<12/cam.zoom) return {name:'rotate'}; }
      return null;
    }

    // ---- transform selection ----
    function moveSelected(dx,dy){
      objects.forEach(o=>{
        if(!selected.has(o.id)) return;
        if(o.type==='stroke'||o.type==='shape'){ o.points.forEach(p=>{p.x+=dx;p.y+=dy;}); o.bbox=null; }
        else { o.x+=dx; o.y+=dy; }
      });
    }
    function scaleSelected(sx,sy,cx,cy){
      objects.forEach(o=>{
        if(!selected.has(o.id)) return;
        if(o.type==='stroke'||o.type==='shape'){ o.points.forEach(p=>{p.x=cx+(p.x-cx)*sx;p.y=cy+(p.y-cy)*sy;}); o.bbox=null; }
        else if(o.type==='image'){ const nx=cx+(o.x-cx)*sx, ny=cy+(o.y-cy)*sy; o.w*=Math.abs(sx); o.h*=Math.abs(sy); o.x=nx; o.y=ny; }
        else if(o.type==='text'){ o.x=cx+(o.x-cx)*sx; o.y=cy+(o.y-cy)*sy; o.size*=Math.max(Math.abs(sx),Math.abs(sy)); }
      });
    }
    function rotateSelected(da,cx,cy){
      const cos=Math.cos(da), sin=Math.sin(da);
      objects.forEach(o=>{
        if(!selected.has(o.id)) return;
        if(o.type==='stroke'||o.type==='shape'){ o.points.forEach(p=>{const dx=p.x-cx,dy=p.y-cy;p.x=cx+dx*cos-dy*sin;p.y=cy+dx*sin+dy*cos;}); o.bbox=null; }
        else { o.rot=(o.rot||0)+da; }
      });
    }
    function deleteSelected(){ if(selected.size===0)return; pushHistory(); objects=objects.filter(o=>!selected.has(o.id)); selected.clear(); redraw(); markDirtyCanvas(); }
    function duplicateSelected(){ if(selected.size===0)return; pushHistory(); const off=20/cam.zoom; const clones=[]; objects.forEach(o=>{if(selected.has(o.id)){const c=JSON.parse(JSON.stringify(o));c.id=App.uid();if(c.type==='stroke'||c.type==='shape')c.points.forEach(p=>{p.x+=off;p.y+=off;});else{c.x+=off;c.y+=off;}if(c.type==='image'&&c.src){const im=new Image();im.src=c.src;c._img=im;}clones.push(c);}}); selected.clear(); clones.forEach(c=>{selected.add(c.id);objects.push(c);}); redraw(); markDirtyCanvas(); }

    // ---- cursor ----
    function updateCursor(){
      if(readonly || tool==='hand' || spaceDown){ canvas.style.cursor = dragMode==='pan'?'grabbing':'grab'; return; }
      if(tool==='pen'||tool==='pencil'){ canvas.style.cursor=penCursor(pen.color); }
      else if(tool==='highlighter'){ canvas.style.cursor=penCursor(pen.color); }
      else if(tool==='eraser'){ canvas.style.cursor=eraserCursor(eraser.size); }
      else if(tool==='text'){ canvas.style.cursor='text'; }
      else { canvas.style.cursor='default'; }
    }
    updateCursor();

    // ---- pointer events ----
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    canvas.addEventListener('wheel', onWheel, {passive:false});

    function onDown(e){
      if(e.pointerType==='mouse' && e.button===2) return;
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
      if(activePointers.size===2){
        const pts=[...activePointers.values()];
        pinchInit={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y), mid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2}, cam:{...cam}};
        dragMode='pinch'; return;
      }
      const wp = toWorld(e.clientX,e.clientY);
      // pan conditions
      if(readonly || e.button===1 || spaceDown || tool==='hand'){
        dragMode='pan'; dragData={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y}; updateCursor(); return;
      }
      if(tool==='pen'||tool==='pencil'||tool==='highlighter'){
        pushHistory();
        dragMode='draw';
        current={id:App.uid(),type:'stroke',tool:tool,color:pen.color,size:pen.size,opacity:pen.opacity,points:[wp],bbox:null};
        redraw();
        return;
      }
      if(tool==='eraser'){ dragMode='erase'; eraseAt(wp); return; }
      if(tool==='lasso'){ dragMode='lasso'; lassoPts=[wp]; return; }
      if(tool==='text'){ createTextOverlay(e.clientX,e.clientY,wp); return; }
      if(tool==='image'){ document.getElementById('canvasImgInput').click(); return; }
      if(tool==='polygon'){
        if(!polyPts){ polyPts=[wp]; dragMode='poly'; }
        else {
          // close if near first
          if(Math.hypot(wp.x-polyPts[0].x,wp.y-polyPts[0].y)<12/cam.zoom && polyPts.length>2){ finishPolygon(); return; }
          polyPts.push(wp);
        }
        redraw(); return;
      }
      if(['line','arrow','rect','ellipse','triangle'].indexOf(tool)>=0){
        pushHistory();
        dragMode='shape';
        current={id:App.uid(),type:'shape',shape:tool,points:[wp,{...wp}],color:pen.color,size:pen.size,opacity:pen.opacity,bbox:null};
        redraw();
        return;
      }
      // select tool
      if(tool==='select'||tool==='lasso'){
        const h=hitHandle(wp);
        if(h && selected.size>0){
          pushHistory();
          if(h.name==='rotate'){ dragMode='select-rotate'; const sb=selBbox(); dragData={cx:sb.cx,cy:sb.cy, startAng:Math.atan2(wp.y-sb.cy,wp.x-sb.cx)}; }
          else { dragMode='select-resize'; const sb=selBbox(); dragData={handle:h.name, sb0:sb}; }
          return;
        }
        const sb=selBbox();
        if(sb && wp.x>=sb.minX&&wp.x<=sb.maxX&&wp.y>=sb.minY&&wp.y<=sb.maxY && selected.size>0){
          pushHistory(); dragMode='select-move'; dragData={last:wp}; return;
        }
        // hit object
        const ho=hitObject(wp);
        if(ho){
          if(!e.shiftKey) selected.clear();
          selected.add(ho.id); dragMode='select-move'; dragData={last:wp}; pushHistory(); redraw(); return;
        }
        if(!e.shiftKey) selected.clear();
        dragMode='rect'; rectSel={x:wp.x,y:wp.y,w:0,h:0}; redraw();
      }
    }

    function onMove(e){
      if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(dragMode==='pinch' && activePointers.size===2 && pinchInit){
        const pts=[...activePointers.values()];
        const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
        const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
        const scale=dist/(pinchInit.dist||1);
        let nz=Math.max(0.1,Math.min(8,pinchInit.cam.zoom*scale));
        const r=canvas.getBoundingClientRect();
        const wx=(mid.x-r.left-pinchInit.cam.x)/pinchInit.cam.zoom, wy=(mid.y-r.top-pinchInit.cam.y)/pinchInit.cam.zoom;
        cam.zoom=nz;
        cam.x=mid.x-r.left - wx*nz + (mid.x-pinchInit.mid.x);
        cam.y=mid.y-r.top - wy*nz + (mid.y-pinchInit.mid.y);
        redraw(); return;
      }
      if(!dragMode) return;
      const wp=toWorld(e.clientX,e.clientY);
      if(dragMode==='pan'){ cam.x=dragData.cx+(e.clientX-dragData.sx); cam.y=dragData.cy+(e.clientY-dragData.sy); redraw(); return; }
      if(dragMode==='draw'){
        const pts=current.points, last=pts[pts.length-1];
        if(Math.hypot(wp.x-last.x,wp.y-last.y)>1.5/cam.zoom){ pts.push(wp); redraw(); }
        return;
      }
      if(dragMode==='erase'){ eraseAt(wp); return; }
      if(dragMode==='lasso'){ lassoPts.push(wp); redraw(); return; }
      if(dragMode==='shape'){ current.points[1]=wp; redraw(); return; }
      if(dragMode==='rect'){ rectSel.w=wp.x-rectSel.x; rectSel.h=wp.y-rectSel.y; redraw(); return; }
      if(dragMode==='select-move'){ moveSelected(wp.x-dragData.last.x, wp.y-dragData.last.y); dragData.last=wp; redraw(); return; }
      if(dragMode==='select-resize'){
        const sb0=dragData.sb0, h=dragData.handle;
        let sx=1, sy=1;
        if(h.indexOf('e')>=0) sx=(wp.x-sb0.minX)/(sb0.w||1);
        if(h.indexOf('w')>=0) sx=(sb0.maxX-wp.x)/(sb0.w||1);
        if(h.indexOf('s')>=0) sy=(wp.y-sb0.minY)/(sb0.h||1);
        if(h.indexOf('n')>=0) sy=(sb0.maxY-wp.y)/(sb0.h||1);
        if(h==='n'||h==='s') sx=1; if(h==='e'||h==='w') sy=1;
        sx=Math.max(0.05,Math.abs(sx))*(sx<0?-1:1); sy=Math.max(0.05,Math.abs(sy))*(sy<0?-1:1);
        // rebuild from snapshot? We scale incrementally — simpler: store snapshot of objects at drag start. Use JSON? We pushHistory before, so undo works. For incremental we need baseline. Store baseline in dragData.
        if(!dragData.base){ dragData.base=JSON.parse(JSON.stringify(objects.filter(o=>selected.has(o.id)))); }
        // apply scale to baseline
        const baseMap={}; dragData.base.forEach(o=>baseMap[o.id]=o);
        objects.forEach(o=>{
          if(!selected.has(o.id)) return;
          const b=baseMap[o.id];
          if(o.type==='stroke'||o.type==='shape'){ o.points=b.points.map(p=>({x:sb0.cx+(p.x-sb0.cx)*sx, y:sb0.cy+(p.y-sb0.cy)*sy})); o.bbox=null; }
          else if(o.type==='image'){ o.x=sb0.cx+(b.x-sb0.cx)*sx; o.y=sb0.cy+(b.y-sb0.cy)*sy; o.w=Math.abs(b.w*sx); o.h=Math.abs(b.h*sy); }
          else if(o.type==='text'){ o.x=sb0.cx+(b.x-sb0.cx)*sx; o.y=sb0.cy+(b.y-sb0.cy)*sy; o.size=b.size*Math.max(Math.abs(sx),Math.abs(sy)); }
        });
        redraw(); return;
      }
      if(dragMode==='select-rotate'){
        const ang=Math.atan2(wp.y-dragData.cy, wp.x-dragData.cx);
        if(!dragData.baseAng) dragData.baseAng=ang;
        if(!dragData.base){ dragData.base=JSON.parse(JSON.stringify(objects.filter(o=>selected.has(o.id)))); }
        const da=ang-dragData.baseAng;
        const baseMap={}; dragData.base.forEach(o=>baseMap[o.id]=o);
        const cx=dragData.cx, cy=dragData.cy, cos=Math.cos(da), sin=Math.sin(da);
        objects.forEach(o=>{
          if(!selected.has(o.id)) return;
          const b=baseMap[o.id];
          if(o.type==='stroke'||o.type==='shape'){ o.points=b.points.map(p=>{const dx=p.x-cx,dy=p.y-cy;return{x:cx+dx*cos-dy*sin,y:cy+dx*sin+dy*cos};}); o.bbox=null; }
          else { o.x=b.x; o.y=b.y; o.rot=(b.rot||0)+da; }
        });
        redraw(); return;
      }
    }

    function onUp(e){
      if(activePointers.has(e.pointerId)) activePointers.delete(e.pointerId);
      if(activePointers.size<2) pinchInit=null;
      if(dragMode==='draw' && current){
        if(current.points.length>0){ objects.push(current); markDirtyCanvas(); }
        current=null;
      }
      if(dragMode==='shape' && current){
        const p=current.points;
        if(Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)>2/cam.zoom){ objects.push(current); markDirtyCanvas(); }
        current=null;
      }
      if(dragMode==='lasso' && lassoPts){
        if(lassoPts.length>3){
          selected.clear();
          objects.forEach(o=>{
            if(o.type==='stroke'){ if(o.points.some(p=>pointInPoly(p,lassoPts))) selected.add(o.id); }
            else { const b=bboxOf(o); if(pointInPoly({x:(b.minX+b.maxX)/2,y:(b.minY+b.maxY)/2},lassoPts)) selected.add(o.id); }
          });
        }
        lassoPts=null;
      }
      if(dragMode==='rect' && rectSel){
        const rx=Math.min(rectSel.x,rectSel.x+rectSel.w), rw=Math.abs(rectSel.w);
        const ry=Math.min(rectSel.y,rectSel.y+rectSel.h), rh=Math.abs(rectSel.h);
        if(rw>3/cam.zoom||rh>3/cam.zoom){
          objects.forEach(o=>{const b=bboxOf(o); if(b.minX<rx+rw&&b.maxX>rx&&b.minY<ry+rh&&b.maxY>ry) selected.add(o.id);});
        }
        rectSel=null;
      }
      if(dragMode && dragMode!=='pan' && dragMode!=='pinch') markDirtyCanvas();
      if(dragMode==='select-move'||dragMode==='select-resize'||dragMode==='select-rotate'){ if(dragData) dragData.base=null; }
      dragMode=null; dragData=null;
      if(selected.size>0){ dragData={handles:getHandles()}; } else { dragData=null; }
      redraw();
      updateCursor();
    }

    function eraseAt(wp){
      const thr = eraser.size/cam.zoom;
      const before=objects.length;
      objects = objects.filter(o=>{
        if(eraser.mode==='stroke' && o.type!=='stroke') return true;
        if(o.type==='stroke'){
          for(let i=0;i<o.points.length-1;i++){ if(distToSeg(wp.x,wp.y,o.points[i].x,o.points[i].y,o.points[i+1].x,o.points[i+1].y)<thr) return false; }
          if(o.points.length===1 && Math.hypot(wp.x-o.points[0].x,wp.y-o.points[0].y)<thr) return false;
          return true;
        }
        const b=bboxOf(o); return !(wp.x>=b.minX&&wp.x<=b.maxX&&wp.y>=b.minY&&wp.y<=b.maxY);
      });
      if(objects.length!==before){ selected.clear(); redraw(); markDirtyCanvas(); }
    }

    function finishPolygon(){
      if(!polyPts || polyPts.length<3){ polyPts=null; redraw(); return; }
      pushHistory();
      objects.push({id:App.uid(),type:'shape',shape:'polygon',points:polyPts.slice(),color:pen.color,size:pen.size,opacity:pen.opacity,bbox:null});
      polyPts=null; redraw(); markDirtyCanvas();
    }

    function onWheel(e){
      e.preventDefault();
      const r=canvas.getBoundingClientRect();
      const mx=e.clientX-r.left, my=e.clientY-r.top;
      const wx=(mx-cam.x)/cam.zoom, wy=(my-cam.y)/cam.zoom;
      const factor = e.deltaY<0 ? 1.1 : 1/1.1;
      cam.zoom = Math.max(0.1, Math.min(8, cam.zoom*factor));
      cam.x = mx - wx*cam.zoom;
      cam.y = my - wy*cam.zoom;
      redraw(); saveDebounced();
    }

    function zoomAt(factor){
      const r=canvas.getBoundingClientRect();
      const mx=r.width/2, my=r.height/2;
      const wx=(mx-cam.x)/cam.zoom, wy=(my-cam.y)/cam.zoom;
      cam.zoom=Math.max(0.1,Math.min(8,cam.zoom*factor));
      cam.x=mx-wx*cam.zoom; cam.y=my-wy*cam.zoom; redraw(); saveDebounced();
    }

    // ---- text overlay ----
    function createTextOverlay(clientX, clientY, wp){
      const stage=document.getElementById('canvasStage');
      const ta=document.createElement('textarea');
      ta.className='text-overlay';
      ta.style.left=(clientX-stage.getBoundingClientRect().left)+'px';
      ta.style.top=(clientY-stage.getBoundingClientRect().top)+'px';
      ta.style.color=textSet.color;
      ta.style.font=`${textSet.italic?'italic ':''}${textSet.bold?'700 ':'400 '}${textSet.size}px ${textSet.font}`;
      ta.placeholder='Type text...';
      stage.appendChild(ta); ta.focus();
      const commit=()=>{
        const v=ta.value.trim();
        if(v){ pushHistory(); objects.push({id:App.uid(),type:'text',x:wp.x,y:wp.y+textSet.size,text:v,font:textSet.font,size:textSet.size,bold:textSet.bold,italic:textSet.italic,color:textSet.color,align:textSet.align,rot:0}); markDirtyCanvas(); }
        ta.remove(); redraw();
      };
      ta.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();commit();} if(ev.key==='Escape'){ta.remove();} });
      ta.addEventListener('blur',commit);
    }

    // ---- image upload ----
    document.getElementById('canvasImgInput').addEventListener('change',e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{
        const im=new Image();
        im.onload=()=>{
          const r=canvas.getBoundingClientRect();
          const wp=toWorld(r.left+r.width/2, r.top+r.height/2);
          const scale=Math.min(400/im.width,400/im.height,1);
          pushHistory();
          const o={id:App.uid(),type:'image',x:wp.x-(im.width*scale)/2,y:wp.y-(im.height*scale)/2,w:im.width*scale,h:im.height*scale,src:r.result,rot:0,_img:im};
          objects.push(o); selected.clear(); selected.add(o.id); redraw(); markDirtyCanvas();
        };
        im.src=r.result;
      };
      r.readAsDataURL(f);
      e.target.value='';
    });

    // ---- keyboard ----
    function onKey(e){
      if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
      if(e.code==='Space'){ spaceDown=true; e.preventDefault(); updateCursor(); }
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
      if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();redo();}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSelected();}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){clipboard=objects.filter(o=>selected.has(o.id)).map(o=>{const c={...o};delete c._img;return c;});}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&clipboard){pushHistory();const off=20/cam.zoom;const ids=new Set();clipboard.forEach(o=>{const c=JSON.parse(JSON.stringify(o));c.id=App.uid();if(c.type==='stroke'||c.type==='shape')c.points.forEach(p=>{p.x+=off;p.y+=off;});else{c.x+=off;c.y+=off;}if(c.type==='image'&&c.src){const im=new Image();im.src=c.src;c._img=im;}objects.push(c);ids.add(c.id);});selected=ids;redraw();markDirtyCanvas();}
      if(e.key==='Delete'||e.key==='Backspace'){ if(selected.size){e.preventDefault();deleteSelected();} }
      if(e.key==='Escape'){ selected.clear(); polyPts=null; lassoPts=null; redraw(); }
      if(e.key==='Enter'&&polyPts){ finishPolygon(); }
    }
    function onKeyUp(e){ if(e.code==='Space'){spaceDown=false;updateCursor();} }
    window.addEventListener('keydown',onKey);
    window.addEventListener('keyup',onKeyUp);

    // ---- UI bindings ----
    const sw=document.getElementById('swatches');
    SWATCHES.forEach(c=>{
      const d=document.createElement('div'); d.className='color-swatch'+(c===pen.color?' active':''); d.style.background=c;
      d.addEventListener('click',()=>{pen.color=c;textSet.color=c;document.querySelectorAll('.color-swatch').forEach(x=>x.classList.toggle('active',x===d));updateCursor();});
      sw.appendChild(d);
    });
    document.getElementById('customColor').addEventListener('input',e=>{pen.color=e.target.value;textSet.color=e.target.value;updateCursor();});
    document.getElementById('sizeRange').addEventListener('input',e=>{pen.size=+e.target.value;document.getElementById('sizeLabel').textContent=pen.size;});
    document.getElementById('opRange').addEventListener('input',e=>{pen.opacity=+e.target.value/100;document.getElementById('opLabel').textContent=e.target.value+'%';});
    document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{
      tool=b.dataset.tool; polyPts=null;
      document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));
      updateCursor();
      if(tool==='eraser'){ eraser.mode = eraser.mode==='stroke'?'object':'stroke'; App.toast('Eraser mode: '+eraser.mode+' (click lại để đổi)'); }
    }));
    document.querySelector('[data-tool="pen"]').classList.add('active');
    document.getElementById('undoBtn').addEventListener('click',undo);
    document.getElementById('redoBtn').addEventListener('click',redo);
    document.getElementById('zoomIn').addEventListener('click',()=>zoomAt(1.25));
    document.getElementById('zoomOut').addEventListener('click',()=>zoomAt(0.8));
    document.getElementById('zoomReset').addEventListener('click',()=>{cam={x:0,y:0,zoom:1};redraw();saveDebounced();});
    document.getElementById('backBtn').addEventListener('click',()=>{ if(doc) location.hash='#/doc/'+doc.id; else location.hash='#/canvases'; });
    document.getElementById('shareCanvasBtn').addEventListener('click',()=>App.openCanvasShareModal(canvasObj));
    document.getElementById('themeSel').addEventListener('change',e=>{canvasObj.theme=e.target.value;Store.saveCanvases();stage.style.background=theme().bg;canvas.style.background=theme().bg;redraw();});
    document.querySelectorAll('[data-sact]').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.sact;
      if(a==='delete') deleteSelected();
      else if(a==='duplicate') duplicateSelected();
      else if(a==='front'||a==='back'){
        if(selected.size===0) return; pushHistory();
        const selObjs=objects.filter(o=>selected.has(o.id));
        objects=objects.filter(o=>!selected.has(o.id));
        if(a==='front') objects=objects.concat(selObjs); else objects=selObjs.concat(objects);
        redraw(); markDirtyCanvas();
      }
    }));
    stage.style.background=theme().bg; canvas.style.background=theme().bg;
    redraw();

    // cleanup
    App.Canvas._cleanup = function(){
      window.removeEventListener('keydown',onKey);
      window.removeEventListener('keyup',onKeyUp);
      window.removeEventListener('resize',resize);
      window.removeEventListener('pointerup',onUp);
      if(rafId) cancelAnimationFrame(rafId);
      saveDebounced();
      App.Canvas._cleanup=null;
    };
  }
};
})();
</script>
<script>
/* ============================================================
   PART 6 — Main render dispatcher + init
   ============================================================ */
(function(){
const App = window.App;
const Store = App.Store;

App.render = function(){
  App.closeModal();
  if(App.Canvas && App.Canvas._cleanup){ App.Canvas._cleanup(); }
  App.applyTheme();
  const v = App.currentView || {view:'home'};
  switch(v.view){
    case 'home': App.renderHome('documents'); break;
    case 'recent': App.renderHome('recent'); break;
    case 'favorites': App.renderHome('favorites'); break;
    case 'trash': App.renderHome('trash'); break;
    case 'canvases': App.renderHome('canvases'); break;
    case 'settings': App.renderSettings(); break;
    case 'doc': App.renderDoc(v.param); break;
    case 'edit': App.renderSharedEdit(v.param); break;
    case 'view': App.renderViewOnly(v.param); break;
    case 'canvas': App.Canvas.open(v.param,'owner'); break;
    case 'canvas-edit': App.Canvas.open(v.param,'edit'); break;
    case 'canvas-view': App.Canvas.open(v.param,'view'); break;
    case 'canvas-shared-view': App.openCanvasMagic(v.param, false); break;
    case 'canvas-shared-edit': App.openCanvasMagic(v.param, true); break;
    case 'pub': App.renderPub(v.param); break;
    case 'shared': App.renderSharedMagic(v.param); break;
    case 'shared-edit': App.renderSharedEditMagic(v.param); break;
    default: App.render404();
  }
};

function createWelcomeDoc(){
  const d = Store.newDoc('Welcome to GAY DOC');
  const cppCode = '#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    vector<int> a = {1, 2, 3};\n    cout << "Hello, GAY DOC!" << endl;\n    cout << a.size() << endl;\n    return 0;\n}';
  d.content = `<h1>Chào mừng đến với GAY DOC</h1>
<p>Một trình soạn thảo tài liệu hiện đại với <b>Markdown</b>, <i>code highlighting</i> và <b>infinite canvas</b>.</p>
<h2>Tính năng chính</h2>
<ul><li>Tạo, lưu, chia sẻ tài liệu bằng link bảo mật</li><li>Hỗ trợ code block nhiều ngôn ngữ với syntax highlighting</li><li>Bảng vẽ vô hạn — zoom, pan, pen, lasso, shapes, text, ảnh</li><li>Tự động lưu, không mất dữ liệu khi reload</li></ul>
<h2>Ví dụ code block C++</h2>
${App.renderCodeBlock(cppCode,'cpp',true)}
<p>Nhấn nút <b>+ Create Canvas</b> ở thanh trên để tạo bảng vẽ vô hạn cho tài liệu này.</p>
<blockquote>Mẹo: gõ <code>\`\`\`cpp</code> rồi Enter ở đầu dòng để tự động tạo code block C++.</blockquote>
<p style="text-align:center;color:#888;font-size:12px;margin-top:48px">Ý tưởng và hoàn thiện GAY DOC: Phan Văn Minh Đức</p>`;
  d.updatedAt=Date.now();
  Store.saveDocs();
  return d;
}

function init(){
  if(Store.docs.length===0 && Store.canvases.length===0){
    createWelcomeDoc();
  }
  App.applyTheme();
  if(!location.hash) location.hash='#/home';
  App.route();
  window.addEventListener('load', ()=>{ if(App.refreshIcons) App.refreshIcons(); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
